name: "lint"

on:
  pull_request: ~
  push: ~

jobs:
  lint:
    name: "lint"
    runs-on: "ubuntu-latest"
    steps:
      - name: "checkout"
        uses: "actions/checkout@v7"

      - name: "installing PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: bcmath, mbstring, intl, sodium, json

      - name: "installing dependencies"
        run: |
          make install -j10 -O

      - name: "running linter"
        run: make lint
        env:
          MAGO_FORMAT: github
